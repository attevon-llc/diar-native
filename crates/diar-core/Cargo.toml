[package]
name = "diar-core"
version = "0.1.0"
edition = "2021"
description = "OpenTranscribe diarization engine: speakrs wrapper with centroids, embed_window, and deployment-tier config"
license = "Apache-2.0"

[features]
default = []
# tensorrt compiles the TRT EP surface in; it stays inert unless SPEAKRS_TRT=1 at runtime
# and falls back to the CUDA EP when the TRT libs are absent (S-T11).
cuda = ["speakrs/cuda", "speakrs/tensorrt", "ort/cuda"]

[dependencies]
speakrs = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
ort = { workspace = true }
ndarray = { workspace = true }
tracing = { workspace = true }
