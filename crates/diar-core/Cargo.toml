[package]
name = "diar-core"
version = "0.3.0"
edition = "2021"
# MSRV: inherited from [workspace.package] in the root Cargo.toml, which explains how the
# 1.88.0 floor was measured and why it differs from the 1.97.1 build pin.
rust-version.workspace = true
description = "OpenTranscribe diarization engine: speakrs wrapper with centroids, embed_window, and deployment-tier config"
license = "Apache-2.0"
# NOT PUBLISHABLE, and this states it rather than leaving it to be discovered:
# the vendored, patched speakrs is a PATH dependency and crates.io rejects those.
# The shipped artifacts are the `diar-server` BINARY and the container images, not a
# crates.io release. `cargo deny check bans` also relies on this: without it, every
# path dependency in the workspace is reported as a wildcard dependency.
publish = false

[features]
default = []
cuda = ["speakrs/cuda", "ort/cuda"]
coreml = ["speakrs/coreml", "ort/coreml"]

[dependencies]
speakrs = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ort = { workspace = true }
ndarray = { workspace = true }
tracing = { workspace = true }
# `logging` only *offers* an init function; nothing in this library installs a subscriber.
# It lives here so diar-server and diar-cli share one answer to "what does an unset RUST_LOG
# mean", while each still picks its own sink (stdout vs stderr).
tracing-subscriber = { workspace = true }
# Provisioning (provision/). `ureq` rather than `reqwest`: preflight makes exactly two
# blocking GETs, and reqwest would drag tokio into diar-core (which the CLI links too) for
# no benefit. rustls keeps it free of a C toolchain.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
sha2 = "0.10"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
# Reading the smoke clip; also already used by diar-server and the tests.
hound = { workspace = true }
# Native media ingest (audio.rs): decode original media in-process instead of requiring a
# pre-decoded 16 kHz WAV. The app's WAV handoff path does not touch these.
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4"] }
rubato = "0.16"

[dev-dependencies]
hound = { workspace = true }
