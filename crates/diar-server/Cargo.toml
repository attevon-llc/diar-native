[package]
name = "diar-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
cuda = ["diar-core/cuda"]
coreml = ["diar-core/coreml"]

[dependencies]
diar-core = { path = "../diar-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hound = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# CLI surface. `Option<Command>` keeps the no-argument invocation serving, exactly as before.
clap = { version = "4", features = ["derive", "env"] }
