[package]
name = "diar-server"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
# NOT PUBLISHABLE, and this states it rather than leaving it to be discovered:
# depends on diar-core by path, which is itself unpublishable.
# The shipped artifacts are the `diar-server` BINARY and the container images, not a
# crates.io release. `cargo deny check bans` also relies on this: without it, every
# path dependency in the workspace is reported as a wildcard dependency.
publish = false

[features]
default = []
cuda = ["diar-core/cuda"]
coreml = ["diar-core/coreml"]

[dependencies]
diar-core = { path = "../diar-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hound = { workspace = true }
# Subscriber setup is `diar_core::logging`; this crate only emits.
tracing = { workspace = true }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# CLI surface. `Option<Command>` keeps the no-argument invocation serving, exactly as before.
clap = { version = "4", features = ["derive", "env"] }
