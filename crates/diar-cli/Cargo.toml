[package]
name = "diar-cli"
version = "0.3.0"
edition = "2021"
# Both inherited from [workspace.package]; see the workspace Cargo.toml for the reasoning.
rust-version.workspace = true
publish.workspace = true
license = "Apache-2.0"

[features]
default = []
cuda = ["diar-core/cuda"]
coreml = ["diar-core/coreml"]

[dependencies]
diar-core = { path = "../diar-core" }
anyhow = { workspace = true }
serde_json = { workspace = true }
hound = { workspace = true }
clap = { version = "4", features = ["derive"] }
