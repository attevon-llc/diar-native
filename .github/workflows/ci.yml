# diar-native CI.
#
# Three constraints shape everything below; none of them are negotiable.
#
#   1. THE HOST CANNOT BUILD THIS PROJECT. speakrs links OpenBLAS through its
#      `openblas-system` feature, so every job installs libopenblas-dev before touching cargo.
#      The environment is defined once, in .github/actions/setup-build-env.
#
#   2. vendor/speakrs IS GITIGNORED AND IS A REQUIRED BUILD INPUT. speakrs is a path
#      dependency, so a clean clone cannot even run `cargo metadata` until
#      scripts/bootstrap_vendor_speakrs.sh has populated it from the public fork at its pinned
#      commit. That script needs no credentials and never prompts.
#
#   3. MODEL WEIGHTS ARE TERMS-GATED AND MUST NEVER ENTER CI. Nothing here downloads a model,
#      nothing needs HF_TOKEN, and no job has access to a repository secret. Every test that
#      requires model artifacts is #[ignore]d behind DIAR_TEST_MODELS_DIR /
#      DIAR_TEST_SMALL_MODELS_DIR / DIAR_TEST_ZEROED_DIR, so a plain `cargo test` cannot reach
#      them. Run those locally — see CONTRIBUTING.md.
#
# CI builds the DEFAULT (CPU) feature set only. `--features cuda` needs the CUDA-enabled ONNX
# Runtime distribution and GitHub-hosted runners have no GPU and no CUDA toolkit; the CUDA image
# is verified by building docker/Dockerfile.server on a GPU host. `--features coreml` compiles
# only on macOS (objc2) and is unreachable through Docker at all, so it is out of scope here too.
#
# CI also runs NO BENCHMARKS, deliberately. Shared runners cannot produce a timing anyone should
# trust, and docs/BENCHMARK_PROTOCOL.md requires a quiet machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep cargo from spending CI minutes on incremental artifacts it will never reuse.
  CARGO_INCREMENTAL: "0"

jobs:
  # --------------------------------------------------------------------------------------
  # Formatting.
  #
  # BLOCKING as of 2026-09-01. It was advisory while 71 pre-existing reformat hunks across 16
  # files stood between the repo and a clean run; `6cd56eb style: apply cargo fmt across the
  # workspace crates` paid that debt, and `cargo fmt -p diar-core -p diar-cli -p diar-server
  # --check` was verified clean against this tree before the gate was turned on. The
  # `continue-on-error` and its TODO are gone — leaving them would have meant an advisory job
  # that could never fire, which is worse than not having one.
  #
  # Note the `-p` scoping. A bare `cargo fmt --all` reformats vendor/speakrs too, because cargo
  # resolves path dependencies — which would silently invalidate
  # patches/0001-cuda-performance-patch-set.patch. Naming the three workspace members keeps the
  # vendored tree untouched; verified as 0 vendor hunks.
  #
  # This job needs the vendor bootstrap (cargo has to resolve the workspace) but NOT OpenBLAS,
  # because `cargo fmt` never compiles anything — so it skips the full build setup and stays
  # fast.
  # --------------------------------------------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal -c rustfmt && rustup default stable

      - name: Populate vendor/speakrs
        run: ./scripts/bootstrap_vendor_speakrs.sh

      - name: Check formatting of the workspace crates
        run: |
          if cargo fmt -p diar-core -p diar-cli -p diar-server --check > fmt.diff 2>&1; then
            echo "All formatted."
          else
            hunks=$(grep -c '^Diff in ' fmt.diff || true)
            vendor=$(grep -c 'vendor/' fmt.diff || true)
            echo "::error title=rustfmt::${hunks} unformatted hunk(s). Fix with: cargo fmt -p diar-core -p diar-cli -p diar-server"
            grep -oP '^Diff in \K[^:]+' fmt.diff | sort | uniq -c | sort -rn
            # Guard the guard: if this is ever non-zero the -p scoping has broken and the
            # vendored patch set is about to be silently rewritten.
            if [ "$vendor" -ne 0 ]; then
              echo "::error title=rustfmt::${vendor} hunk(s) inside vendor/ — the -p scoping is broken. DO NOT run cargo fmt until this is fixed."
              exit 1
            fi
            cat fmt.diff
            exit 1
          fi

  # --------------------------------------------------------------------------------------
  # Clippy.
  #
  # BLOCKING, with ZERO exemptions. This block used to describe two named `-A` flags carried as
  # pre-existing debt; both findings (`neg_cmp_op_on_partial_ord`, `chunks_exact_to_as_chunks`)
  # were fixed in 5e759c1 and the flags deleted, so `-D warnings` is now in force for every
  # lint without qualification. Keep it that way — see the note on the step itself.
  #
  # `-D warnings` applies only to workspace members, not to path dependencies — verified
  # empirically on 2026-08-31: speakrs' own `dead_code` warning stays a warning and does not
  # fail the build. So this gates OUR crates without dragging in vendored-code debt.
  # --------------------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: clippy

      - name: cargo clippy --all-targets -D warnings
        run: |
          cargo clippy --release --workspace --all-targets -- -D warnings
        # No -A exemptions, deliberately. The two that used to be here
        # (neg_cmp_op_on_partial_ord, chunks_exact_to_as_chunks) were fixed rather than
        # carried. Do not add one without fixing the finding instead — a growing list is how
        # a gate becomes decoration.

  # --------------------------------------------------------------------------------------
  # Build and test, default (CPU) features. No models, no token, no network beyond crates.io.
  # --------------------------------------------------------------------------------------
  build-and-test:
    name: build + test (CPU features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: build

      - name: cargo build --release -p diar-server -p diar-cli
        run: cargo build --release -p diar-server -p diar-cli

      - name: cargo test --release -p diar-core -p diar-server
        # The model-dependent tests are #[ignore]d and gated on DIAR_TEST_MODELS_DIR et al.
        # They are NOT run here and must never be: the weights are terms-gated derivatives of
        # pyannote community-1 and may not be redistributed. `cargo test` skips them by default,
        # so this needs no filter — but do not add `-- --ignored`.
        run: cargo test --release -p diar-core -p diar-server

      - name: The binaries actually start
        run: |
          ./target/release/diar-server --help > /dev/null
          ./target/release/diar-cli --help > /dev/null
          echo "Both binaries run."

  # --------------------------------------------------------------------------------------
  # Docker build-context guard.
  #
  # The context was 8.3 GB and contained 1.1 GB of TERMS-GATED WEIGHTS until .dockerignore
  # landed in c160129. This job makes that regression impossible to reintroduce silently.
  #
  # It is not enough to assert "models/ is not in the context" on a clean clone — those
  # directories are gitignored, so they do not exist in CI and the assertion would pass
  # vacuously while proving nothing. So the job FABRICATES the decoys first, then proves
  # .dockerignore excludes them. That is what makes this a real test.
  # --------------------------------------------------------------------------------------
  docker-context-guard:
    name: .dockerignore guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Populate vendor/speakrs
        run: ./scripts/bootstrap_vendor_speakrs.sh

      - name: Plant decoys that MUST NOT reach the build context
        run: |
          set -eux
          mkdir -p models models_folded models_small venv/bin venv-export/bin \
                   target/release upstream-work vendor/speakrs/target
          # Big enough that a leak is unmissable in the context size, small enough to be free.
          for d in models models_folded models_small; do
            head -c 4194304 /dev/urandom > "$d/DECOY_gated_weights.onnx"
          done
          echo "decoy" > venv/bin/DECOY_python
          echo "decoy" > venv-export/bin/DECOY_python
          echo "decoy" > target/release/DECOY_binary
          echo "decoy" > upstream-work/DECOY
          echo "decoy" > vendor/speakrs/target/DECOY

      - name: Assert the context holds the build inputs and nothing else
        run: docker build -f .github/ci/Dockerfile.context-guard -t diar-context-guard:ci .

  # --------------------------------------------------------------------------------------
  # The CPU runtime image. Small (about 195 MB), needs no GPU, and is the artifact most likely
  # to break independently of the cargo build — it has caught a missing `COPY scripts/` and an
  # out-of-scope TARGETARCH already.
  #
  # Built for linux/amd64 only and NEVER pushed. Multi-arch and publishing live in
  # release.yml, which is manual/tag-triggered and is the only place credentials are used.
  # --------------------------------------------------------------------------------------
  docker-cpu-image:
    name: docker build (CPU image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Populate vendor/speakrs
        run: ./scripts/bootstrap_vendor_speakrs.sh

      - name: Build docker/Dockerfile.server-cpu
        run: docker build --platform linux/amd64 -f docker/Dockerfile.server-cpu -t diar-server:ci .

      # No models are provisioned here and none ever will be — they are terms-gated. So this
      # cannot test diarization. What it CAN test, and what has actually broken before, is
      # whether the image is assembled correctly: that the binary's shared libraries resolve
      # (the ONNX Runtime .so files are unpacked from a tarball into /usr/local/lib by hand),
      # and that the entrypoint reaches the startup model gate and fails for that reason rather
      # than dying earlier for some other one.
      - name: Every shared library resolves
        run: |
          set -eu
          missing=$(docker run --rm --entrypoint sh diar-server:ci -c \
            'ldd /usr/local/bin/diar-server | grep -c "not found" || true')
          echo "unresolved shared libraries: ${missing}"
          if [ "${missing}" -ne 0 ]; then
            docker run --rm --entrypoint sh diar-server:ci -c 'ldd /usr/local/bin/diar-server'
            echo "::error::The binary has unresolved shared libraries; the ORT runtime libs are not installed correctly."
            exit 1
          fi

      - name: The binary runs and its CLI surface is intact
        run: |
          set -eu
          docker run --rm --entrypoint /usr/local/bin/diar-server diar-server:ci --help

      - name: Starting without models hits the model gate, exit 8
        run: |
          set -eu
          rc=0
          docker run --rm --name diar-ci -e DIAR_DEVICES=cpu diar-server:ci > gate.log 2>&1 || rc=$?
          cat gate.log
          # Exit 8 is the startup model gate refusing to serve. It was 6 until the exit codes
          # were split: 6 now means "no usable python export environment", which is a
          # completely different remediation, and a supervisor branching on the code could not
          # tell them apart. Any other code means it fell over somewhere else.
          if [ "$rc" -ne 8 ]; then
            echo "::error::Expected exit 8 (model gate), got ${rc}."
            exit 1
          fi
          grep -q 'provision-models' gate.log || {
            echo "::error::The model-gate message no longer tells the operator how to fix it."
            exit 1
          }
          echo "Model gate behaved correctly."
          echo "Image size: $(docker image inspect diar-server:ci --format '{{.Size}}' | numfmt --to=iec)"

  # --------------------------------------------------------------------------------------
  # Python utility scripts. scripts/ and validation/ are developer tooling, not a package, so
  # the rule set in .ruff.toml is deliberately narrow. `ruff format` is NOT enforced: 14 of 20
  # files would be reformatted today, and that is a separate decision from linting.
  # --------------------------------------------------------------------------------------
  python-lint:
    name: ruff (scripts/ + validation/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --disable-pip-version-check 'ruff==0.16.1'

      - name: ruff check
        run: ruff check --no-cache scripts/ validation/

  # --------------------------------------------------------------------------------------
  # Supply chain, licences and dependency hygiene.
  #
  # BLOCKING. The policy — every allowance, every exception, and the reasoning and date behind
  # each — lives in deny.toml, which is the file to read; this job only runs it.
  #
  # Three properties of this repo make it worth a gate rather than an occasional manual audit:
  # we VENDOR AND PATCH a third-party crate (so most of the dependency tree arrived without
  # anyone running `cargo add`), we PIN `ort` TO A RELEASE CANDIDATE that must not move, and we
  # REDISTRIBUTE every one of these crates compiled into a public container image, which makes
  # licence obligations real rather than theoretical.
  #
  # No OpenBLAS and no build: cargo-deny reads Cargo.lock and crate metadata, it never compiles
  # anything. It DOES need vendor/speakrs, because speakrs is a path dependency and `cargo
  # metadata` cannot resolve the workspace without it. It also needs network, to fetch the
  # RustSec advisory database.
  #
  # NOT ALSO cargo-audit, deliberately. It reads the same RustSec database that
  # `cargo deny check advisories` already reads, so running both would double the runtime and
  # the noise to report the same findings twice. The one thing cargo-audit adds that cargo-deny
  # does not is `cargo audit bin`, which scans a COMPILED binary for embedded crate versions —
  # interesting for auditing a published image whose source you do not have, and redundant here,
  # where CI builds the binary from the lockfile it just checked.
  # --------------------------------------------------------------------------------------
  cargo-deny:
    name: cargo-deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pin the Rust toolchain
        # No channel argument: rustup reads rust-toolchain.toml. cargo-deny shells out to
        # `cargo metadata`, so a toolchain has to exist even though nothing is compiled.
        run: rustup show active-toolchain

      - name: Populate vendor/speakrs
        run: ./scripts/bootstrap_vendor_speakrs.sh

      # Pinned to an exact release and verified by digest, rather than installed from a
      # floating action or built from source. A gate that silently changes version underneath
      # you produces the same failure rust-toolchain.toml exists to prevent: CI turning red on
      # a PR that changed nothing relevant. Bumping this is a two-line edit (version + digest).
      - name: Install cargo-deny 0.20.2
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          tarball="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}"
          echo "${CARGO_DENY_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" --strip-components=1
          sudo install -m 0755 cargo-deny /usr/local/bin/cargo-deny
          cargo-deny --version

      - name: cargo deny check
        # All four checks in one invocation so the summary line reports every category even
        # when an earlier one fails; a per-check split would hide later findings behind the
        # first failure.
        run: cargo deny --all-features check

  # --------------------------------------------------------------------------------------
  # API documentation.
  #
  # BLOCKING, and the thing it actually protects is the comments that already exist. This code
  # is unusually heavily commented — much of it is doc-comment quality already, and several
  # modules encode measured results and hard-won platform findings that a reader will follow
  # from a link. `-D warnings` here means a broken intra-doc link, an unclosed HTML tag or an
  # unresolvable path fails the build instead of rendering as silent garbage.
  #
  # It has already earned its place: it caught `<label>_run<N>.json` in diar-cli's `--json`
  # help text, where rustdoc read `<label>` and `<N>` as unclosed HTML tags.
  #
  # `missing_docs` is deliberately NOT enabled. Turning it on across three crates would demand
  # a doc comment on every public item at once, and the result of that is always the same:
  # hundreds of restatements of the item's own name, which make the real comments harder to
  # find. The lint to add later, if any, is `rustdoc::missing_crate_level_docs`.
  #
  # `--no-deps` keeps this to our three crates. Documenting the full tree would spend CI
  # minutes rendering ~250 crates nobody reads here, and would surface warnings in code this
  # repo does not own — including vendor/speakrs, whose doc comments are upstream's to fix.
  # --------------------------------------------------------------------------------------
  docs:
    name: cargo doc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: docs

      - name: cargo doc --no-deps --workspace
        env:
          # Applies to the workspace crates being documented. Deps are not documented at all
          # under --no-deps, so this cannot fail on third-party or vendored comments.
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

  # --------------------------------------------------------------------------------------
  # Test coverage.
  #
  # REPORTS, DOES NOT GATE — and there is no threshold, on purpose. A number introduced with a
  # floor attached invites the floor to be met rather than the tests to be written, and this
  # repo's number is not comparable to a normal one anyway. Read the caveat the job prints
  # before drawing any conclusion from it.
  #
  # WHY THE NUMBER UNDERSTATES REALITY. Ten integration tests in
  # crates/diar-core/tests/provision_smoke.rs are `#[ignore]`d behind DIAR_TEST_MODELS_DIR /
  # DIAR_TEST_SMALL_MODELS_DIR / DIAR_TEST_ZEROED_DIR. They are not skipped because they are
  # flaky or unfinished: they need real model weights, which are terms-gated derivatives of
  # pyannote community-1 and MUST NEVER reach CI. They cover the provisioning and verification
  # paths — some of the largest modules in diar-core — and they run locally, against a real
  # models directory, as documented in CONTRIBUTING.md. Every line they exercise is counted as
  # uncovered here.
  #
  # MEASURED BASELINE, 2026-09-01, cargo-llvm-cov 0.9.0: 49.14% of lines, 48.75% of regions.
  # The shape of that number is more informative than the number. `provision/verify.rs` reports
  # 8.56% and `gender.rs` and `audio.rs` report 0.00% — those are precisely the modules whose
  # tests are weight-gated or that need real media to exercise. `provision/files.rs` (97%),
  # `marker.rs` (94%) and `logging.rs` (86%) show what the pure-logic modules actually look
  # like. `main.rs` at 0% is the server entry point, which no unit test enters.
  # So: do not read 49% as "half the code is untested".
  #
  # `continue-on-error` is set so a coverage-tool failure can never block a PR. This job is
  # instrumentation, not a gate; if it is ever promoted to a gate, that line must go.
  # --------------------------------------------------------------------------------------
  coverage:
    name: coverage (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          # Its own cache: instrumented artifacts are incompatible with the plain build's.
          cache-key: coverage

      - name: Install llvm-tools-preview
        # cargo-llvm-cov drives llvm-profdata/llvm-cov out of this component. It is not in the
        # `minimal` profile rust-toolchain.toml selects, so it has to be added explicitly.
        run: rustup component add llvm-tools-preview

      # Pinned and digest-verified for the same reason as cargo-deny above.
      - name: Install cargo-llvm-cov 0.9.0
        env:
          LLVM_COV_VERSION: "v0.9.0"
          LLVM_COV_SHA256: "bc2122fd7bd9b6d3eb371690ed085f82e5a8bf1851f4645ef521d12ed04b2616"
        run: |
          set -euo pipefail
          tarball="cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/${LLVM_COV_VERSION}/${tarball}"
          echo "${LLVM_COV_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball"
          sudo install -m 0755 cargo-llvm-cov /usr/local/bin/cargo-llvm-cov
          cargo llvm-cov --version

      - name: Measure coverage
        # Scoped to the two crates that have tests, matching the build-and-test job. diar-cli
        # is a bench runner with no test module; including it would add a 0%-covered binary to
        # the total and make the headline number say less, not more.
        #
        # NOT `-- --ignored`. The ignored tests need terms-gated weights; see the block comment
        # above and the constraints at the top of this file.
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace \
            --exclude diar-cli \
            --ignore-filename-regex '^vendor/' \
            --summary-only | tee coverage.txt

      - name: Publish the number with its caveat attached
        # The caveat travels with the number, in the same place a reader will see it. A bare
        # percentage in a job log is how "we do not test provisioning" gets inferred from
        # "provisioning is tested against weights CI is not allowed to have".
        if: always()
        run: |
          {
            echo "## Coverage (report only — no threshold, never gates)"
            echo
            echo '```'
            cat coverage.txt 2>/dev/null || echo "coverage did not produce a summary"
            echo '```'
            echo
            echo "### Read this before quoting the number"
            echo
            echo "**It understates real coverage, by design.** Ten integration tests in"
            echo "\`crates/diar-core/tests/provision_smoke.rs\` are \`#[ignore]\`d behind"
            echo "\`DIAR_TEST_MODELS_DIR\` / \`DIAR_TEST_SMALL_MODELS_DIR\` / \`DIAR_TEST_ZEROED_DIR\`"
            echo "because they need real model weights — terms-gated derivatives of pyannote"
            echo "community-1 that must never reach CI. They cover the provisioning and"
            echo "verification paths, among the largest modules in \`diar-core\`, and they are run"
            echo "locally against a real models directory (see CONTRIBUTING.md). Every line they"
            echo "exercise is counted as uncovered above."
            echo
            echo "\`vendor/speakrs\` is excluded: it is upstream code with its own 94-test suite."
          } >> "$GITHUB_STEP_SUMMARY"
