# diar-native CI.
#
# Three constraints shape everything below; none of them are negotiable.
#
#   1. THE HOST CANNOT BUILD THIS PROJECT. speakrs links OpenBLAS through its
#      `openblas-system` feature, so every job installs libopenblas-dev before touching cargo.
#      The environment is defined once, in .github/actions/setup-build-env.
#
#   2. vendor/speakrs IS GITIGNORED AND IS A REQUIRED BUILD INPUT. speakrs is a path
#      dependency, so a clean clone cannot even run `cargo metadata` until
#      scripts/bootstrap_vendor_speakrs.sh has populated it from the public fork at its pinned
#      commit. That script needs no credentials and never prompts.
#
#   3. MODEL WEIGHTS ARE TERMS-GATED AND MUST NEVER ENTER CI. Nothing here downloads a model,
#      nothing needs HF_TOKEN, and no job has access to a repository secret. Every test that
#      requires model artifacts is #[ignore]d behind DIAR_TEST_MODELS_DIR /
#      DIAR_TEST_SMALL_MODELS_DIR / DIAR_TEST_ZEROED_DIR, so a plain `cargo test` cannot reach
#      them. Run those locally — see CONTRIBUTING.md.
#
# CI builds the DEFAULT (CPU) feature set only. `--features cuda` needs the CUDA-enabled ONNX
# Runtime distribution and GitHub-hosted runners have no GPU and no CUDA toolkit; the CUDA image
# is verified by building docker/Dockerfile.server on a GPU host. `--features coreml` compiles
# only on macOS (objc2) and is unreachable through Docker at all, so it is out of scope here too.
#
# CI also runs NO BENCHMARKS, deliberately. Shared runners cannot produce a timing anyone should
# trust, and docs/BENCHMARK_PROTOCOL.md requires a quiet machine.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep cargo from spending CI minutes on incremental artifacts it will never reuse.
  CARGO_INCREMENTAL: "0"

jobs:
  # --------------------------------------------------------------------------------------
  # Formatting.
  #
  # ADVISORY, NOT BLOCKING — and that is a deliberate, temporary baseline, not an oversight.
  # Measured against a clean clone of c160129 on 2026-08-31: 71 reformat hunks across 16 files
  # in crates/**, all predating this workflow. Turning the gate on today would paint every PR
  # red for reasons unrelated to the PR.
  #
  # TO FIX: run `cargo fmt -p diar-core -p diar-cli -p diar-server` once, commit it alone, then
  # DELETE the `continue-on-error` line below. Nothing else needs to change.
  #
  # Note the `-p` scoping. A bare `cargo fmt --all` reformats vendor/speakrs too, because cargo
  # resolves path dependencies — which would silently invalidate
  # patches/0001-cuda-performance-patch-set.patch. Naming the three workspace members keeps the
  # vendored tree untouched; verified as 0 vendor hunks.
  #
  # This job needs the vendor bootstrap (cargo has to resolve the workspace) but NOT OpenBLAS,
  # because `cargo fmt` never compiles anything — so it skips the full build setup and stays
  # fast.
  # --------------------------------------------------------------------------------------
  fmt:
    name: rustfmt (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true # TODO: remove once the one-shot `cargo fmt` has landed.
    steps:
      - uses: actions/checkout@v7

      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal -c rustfmt && rustup default stable

      - name: Populate vendor/speakrs
        run: ./scripts/bootstrap_vendor_speakrs.sh

      - name: Check formatting of the workspace crates
        run: |
          if cargo fmt -p diar-core -p diar-cli -p diar-server --check > fmt.diff 2>&1; then
            echo "All formatted."
          else
            hunks=$(grep -c '^Diff in ' fmt.diff || true)
            vendor=$(grep -c 'vendor/' fmt.diff || true)
            echo "::warning title=rustfmt::${hunks} unformatted hunk(s). Fix with: cargo fmt -p diar-core -p diar-cli -p diar-server"
            grep -oP '^Diff in \K[^:]+' fmt.diff | sort | uniq -c | sort -rn
            # Guard the guard: if this is ever non-zero the -p scoping has broken and the
            # vendored patch set is about to be silently rewritten.
            if [ "$vendor" -ne 0 ]; then
              echo "::error title=rustfmt::${vendor} hunk(s) inside vendor/ — the -p scoping is broken. DO NOT run cargo fmt until this is fixed."
              exit 1
            fi
            cat fmt.diff
            exit 1
          fi

  # --------------------------------------------------------------------------------------
  # Clippy.
  #
  # BLOCKING, with exactly two named exemptions. `-D warnings` is genuinely in force for every
  # other lint; the two `-A` flags below are the pre-existing debt, named individually so the
  # list can only shrink and so nobody has to guess what "the baseline" means.
  #
  # `-D warnings` applies only to workspace members, not to path dependencies — verified
  # empirically on 2026-08-31: speakrs' own `dead_code` warning stays a warning and does not
  # fail the build. So this gates OUR crates without dragging in vendored-code debt.
  # --------------------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: clippy

      - name: cargo clippy --all-targets -D warnings
        run: |
          cargo clippy --release --workspace --all-targets -- -D warnings
        # No -A exemptions, deliberately. The two that used to be here
        # (neg_cmp_op_on_partial_ord, chunks_exact_to_as_chunks) were fixed rather than
        # carried. Do not add one without fixing the finding instead — a growing list is how
        # a gate becomes decoration.

  # --------------------------------------------------------------------------------------
  # API documentation.
  #
  # BLOCKING, and it is a link checker rather than a documentation mandate. `missing_docs` is
  # deliberately NOT enabled: this codebase is already heavily commented, and turning that lint on
  # would produce hundreds of `/// Foo.` stubs that restate the item name and teach nobody
  # anything. What this job protects is the prose that already exists — specifically the
  # intra-doc links, which rot SILENTLY. `[`crate::foo::BAR`]` that no longer resolves renders as
  # plain text; nothing fails, and the reader just never notices the cross-reference is gone.
  #
  # `-D warnings` promotes the whole `rustdoc::` lint group, so it also catches malformed HTML in
  # doc comments. That is not hypothetical here: `diar-cli`'s `--json` help text contained
  # `<label>_run<N>.json`, which rustdoc parsed as two unclosed HTML tags. Doc comments on clap
  # `#[arg]` fields are BOTH `--help` output and rustdoc input, so this job reaches text an
  # operator reads at the terminal.
  #
  # `--no-deps` so speakrs' own documentation warnings are not our problem; default features
  # only, for the same reason every other job uses them (`cuda` needs the CUDA ORT distribution,
  # `coreml` needs macOS).
  # --------------------------------------------------------------------------------------
  docs:
    name: cargo doc (rustdoc -D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: docs

      - name: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

  # --------------------------------------------------------------------------------------
  # Build and test, default (CPU) features. No models, no token, no network beyond crates.io.
  # --------------------------------------------------------------------------------------
  build-and-test:
    name: build + test (CPU features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: build

      - name: cargo build --release -p diar-server -p diar-cli
        run: cargo build --release -p diar-server -p diar-cli

      - name: cargo test --release -p diar-core -p diar-server
        # The model-dependent tests are #[ignore]d and gated on DIAR_TEST_MODELS_DIR et al.
        # They are NOT run here and must never be: the weights are terms-gated derivatives of
        # pyannote community-1 and may not be redistributed. `cargo test` skips them by default,
        # so this needs no filter — but do not add `-- --ignored`.
        run: cargo test --release -p diar-core -p diar-server

      - name: The binaries actually start
        run: |
          ./target/release/diar-server --help > /dev/null
          ./target/release/diar-cli --help > /dev/null
          echo "Both binaries run."

  # --------------------------------------------------------------------------------------
  # Coverage.
  #
  # REPORTS, NEVER GATES. There is no threshold and no day-one target, on purpose.
  #
  # THE NUMBER IS AN UNDERCOUNT, AND NOT BY A LITTLE. Ten integration tests in
  # crates/diar-core/tests/provision_smoke.rs are `#[ignore]`d behind DIAR_TEST_MODELS_DIR,
  # DIAR_TEST_SMALL_MODELS_DIR, DIAR_TEST_ZEROED_DIR and DIAR_TEST_ZEROED_MULTIMASK_DIR, because
  # they need terms-gated derivatives of pyannote community-1 weights that MUST NOT reach CI.
  # They are the tests that exercise provision/verify.rs, gender.rs and audio.rs — which is
  # exactly why those files read as 0-14% here. Those paths are tested; they are tested on a
  # workstation that holds the weights (see CONTRIBUTING.md), not on this runner.
  #
  # So a low number in this job means "CI cannot see it", not "nobody wrote a test". The job
  # prints that caveat next to the number every run rather than leaving it in a comment nobody
  # opens, because a bare percentage in a CI summary WILL eventually be read as neglect and
  # someone will "fix" it by loosening something that matters.
  #
  # A threshold would make this worse, not better: it would be set against the crippled number,
  # and the cheapest way to move it is always to test the easy code.
  # --------------------------------------------------------------------------------------
  coverage:
    name: coverage (report only, no gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-env
        with:
          cache-key: coverage

      # Not in rust-toolchain.toml's `components`: that file is honoured by the builder image and
      # every workstation too, and this is ~25 MB of LLVM tooling that only this job needs.
      - name: Add llvm-tools-preview
        run: rustup component add llvm-tools-preview

      # Pinned by tag AND sha256, same reasoning as the cargo-deny job: a coverage number that
      # moves because the tool silently updated is not a measurement.
      - name: Install cargo-llvm-cov
        env:
          LLVM_COV_VERSION: "v0.9.0"
          LLVM_COV_SHA256: "bc2122fd7bd9b6d3eb371690ed085f82e5a8bf1851f4645ef521d12ed04b2616"
        run: |
          set -euo pipefail
          asset="cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLf -o "$asset" \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/${LLVM_COV_VERSION}/${asset}"
          echo "${LLVM_COV_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" -C /usr/local/bin cargo-llvm-cov

      # One instrumented test run produces the lcov file; `report` then re-renders the SAME
      # profile data as a table, so the tests are not run twice.
      - name: Measure coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage.txt

      - name: Report the number, and what it cannot see
        run: |
          set -euo pipefail
          # Counts the `#[ignore = "..."]` attributes, all of which gate on a DIAR_TEST_* models
          # directory. If this ever prints 0, the gating scheme changed and this caveat is stale.
          ignored=$(grep -rho '#\[ignore = ' crates/ --include='*.rs' | wc -l)
          total=$(awk '/^TOTAL/ {print $(NF-3)}' coverage.txt)
          {
            echo "## Coverage: ${total} lines (report only — no gate)"
            echo
            echo "**This is a floor, not the real figure.** \`${ignored}\` integration tests are"
            echo "\`#[ignore]\`d behind \`DIAR_TEST_*\` environment variables because they need"
            echo "terms-gated pyannote community-1 model derivatives, which must never reach CI."
            echo "They are the tests that cover \`provision/verify.rs\`, \`gender.rs\` and"
            echo "\`audio.rs\` — so those files reading near zero below is CI's blind spot, not"
            echo "missing tests. Run them locally with the weights present; see CONTRIBUTING.md."
            echo
            echo "\`diar-cli/src/main.rs\` and \`diar-server/src/main.rs\` also read 0%: the first"
            echo "is the benchmark runner (exercised by docs/BENCHMARK_PROTOCOL.md, not by"
            echo "\`cargo test\`), and the second is process wiring in a binary crate that has no"
            echo "\`tests/\` directory at all — which is why the testable logic was moved into"
            echo "diar-core in the first place."
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  # --------------------------------------------------------------------------------------
  # Docker build-context guard.
  #
  # The context was 8.3 GB and contained 1.1 GB of TERMS-GATED WEIGHTS until .dockerignore
  # landed in c160129. This job makes that regression impossible to reintroduce silently.
  #
  # It is not enough to assert "models/ is not in the context" on a clean clone — those
  # directories are gitignored, so they do not exist in CI and the assertion would pass
  # vacuously while proving nothing. So the job FABRICATES the decoys first, then proves
  # .dockerignore excludes them. That is what makes this a real test.
  # --------------------------------------------------------------------------------------
  docker-context-guard:
    name: .dockerignore guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Populate vendor/speakrs
        run: ./scripts/bootstrap_vendor_speakrs.sh

      - name: Plant decoys that MUST NOT reach the build context
        run: |
          set -eux
          mkdir -p models models_folded models_small venv/bin venv-export/bin \
                   target/release upstream-work vendor/speakrs/target
          # Big enough that a leak is unmissable in the context size, small enough to be free.
          for d in models models_folded models_small; do
            head -c 4194304 /dev/urandom > "$d/DECOY_gated_weights.onnx"
          done
          echo "decoy" > venv/bin/DECOY_python
          echo "decoy" > venv-export/bin/DECOY_python
          echo "decoy" > target/release/DECOY_binary
          echo "decoy" > upstream-work/DECOY
          echo "decoy" > vendor/speakrs/target/DECOY

      - name: Assert the context holds the build inputs and nothing else
        run: docker build -f .github/ci/Dockerfile.context-guard -t diar-context-guard:ci .

  # --------------------------------------------------------------------------------------
  # The CPU runtime image. Small (about 195 MB), needs no GPU, and is the artifact most likely
  # to break independently of the cargo build — it has caught a missing `COPY scripts/` and an
  # out-of-scope TARGETARCH already.
  #
  # Built for linux/amd64 only and NEVER pushed. Multi-arch and publishing live in
  # release.yml, which is manual/tag-triggered and is the only place credentials are used.
  # --------------------------------------------------------------------------------------
  docker-cpu-image:
    name: docker build (CPU image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Populate vendor/speakrs
        run: ./scripts/bootstrap_vendor_speakrs.sh

      - name: Build docker/Dockerfile.server-cpu
        run: docker build --platform linux/amd64 -f docker/Dockerfile.server-cpu -t diar-server:ci .

      # No models are provisioned here and none ever will be — they are terms-gated. So this
      # cannot test diarization. What it CAN test, and what has actually broken before, is
      # whether the image is assembled correctly: that the binary's shared libraries resolve
      # (the ONNX Runtime .so files are unpacked from a tarball into /usr/local/lib by hand),
      # and that the entrypoint reaches the startup model gate and fails for that reason rather
      # than dying earlier for some other one.
      - name: Every shared library resolves
        run: |
          set -eu
          missing=$(docker run --rm --entrypoint sh diar-server:ci -c \
            'ldd /usr/local/bin/diar-server | grep -c "not found" || true')
          echo "unresolved shared libraries: ${missing}"
          if [ "${missing}" -ne 0 ]; then
            docker run --rm --entrypoint sh diar-server:ci -c 'ldd /usr/local/bin/diar-server'
            echo "::error::The binary has unresolved shared libraries; the ORT runtime libs are not installed correctly."
            exit 1
          fi

      - name: The binary runs and its CLI surface is intact
        run: |
          set -eu
          docker run --rm --entrypoint /usr/local/bin/diar-server diar-server:ci --help

      - name: Starting without models hits the model gate, exit 8
        run: |
          set -eu
          rc=0
          docker run --rm --name diar-ci -e DIAR_DEVICES=cpu diar-server:ci > gate.log 2>&1 || rc=$?
          cat gate.log
          # Exit 8 is the startup model gate refusing to serve. It was 6 until the exit codes
          # were split: 6 now means "no usable python export environment", which is a
          # completely different remediation, and a supervisor branching on the code could not
          # tell them apart. Any other code means it fell over somewhere else.
          if [ "$rc" -ne 8 ]; then
            echo "::error::Expected exit 8 (model gate), got ${rc}."
            exit 1
          fi
          grep -q 'provision-models' gate.log || {
            echo "::error::The model-gate message no longer tells the operator how to fix it."
            exit 1
          }
          echo "Model gate behaved correctly."
          echo "Image size: $(docker image inspect diar-server:ci --format '{{.Size}}' | numfmt --to=iec)"

  # --------------------------------------------------------------------------------------
  # Supply chain: advisories, licences, duplicate/banned crates, and dependency sources.
  #
  # Everything this job decides lives in deny.toml, which carries the reasoning for every
  # exception. The policy in one line: no blanket allows, same as the clippy job.
  #
  # Three properties of THIS project make it worth more than the usual boilerplate:
  #   * it vendors Apache-2.0 speakrs and republishes patched builds of it;
  #   * `ort` is pinned to a RELEASE CANDIDATE (`=2.0.0-rc.12`) and must stay there — rc.13 fails
  #     at session load, which no CI job can observe because CI has no model weights;
  #   * the runtime ships beside terms-gated weights, so the crate graph is the one part of the
  #     licence story that can be settled mechanically. Keeping it permissive-only keeps the
  #     hard conversation about the weights alone.
  #
  # NOT ALSO cargo-audit. It reads the same RustSec database that `cargo deny check advisories`
  # does, and deny additionally covers yanked crates, unmaintained crates (`unmaintained = "all"`
  # here, not just the workspace), licences, duplicates and sources. The one thing cargo-audit
  # adds — `cargo audit bin`, auditing a compiled binary through its embedded audit data — needs
  # a binary built with `cargo auditable`, which this project does not produce. Two tools reading
  # one database is two things to keep current, not two gates.
  #
  # This job needs the vendor bootstrap (cargo has to resolve the path dependency) but NOT
  # OpenBLAS: cargo-deny reads `cargo metadata` and `Cargo.lock` and compiles nothing. So, like
  # the fmt job, it skips the full build setup and stays fast.
  #
  # The advisory database is fetched at run time, so this job can start failing WITHOUT a commit
  # in this repo. That is the point of it, not a flake.
  # --------------------------------------------------------------------------------------
  supply-chain:
    name: cargo-deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Populate vendor/speakrs
        run: ./scripts/bootstrap_vendor_speakrs.sh

      # Pinned by version AND by checksum, and installed from the upstream release rather than
      # through a third-party action, so what runs here is exactly what was run locally when
      # deny.toml's exceptions were written down. A floating tool version would let this gate's
      # verdict change with no commit in this repo and no advisory — the one kind of red that
      # teaches people to ignore a job.
      #
      # TO BUMP: change both lines, re-run `cargo deny --all-features check` locally, and only
      # then push. Checksums are published beside each asset as `<asset>.sha256`.
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: "0.20.2"
          CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSLf -o "$asset" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${asset}"
          echo "${CARGO_DENY_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" --strip-components=1 -C /usr/local/bin "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          cargo deny --version

      # --all-features so the `cuda` and `coreml` dependency trees are audited too. Neither is
      # COMPILED here (CI has no CUDA toolkit, and objc2 needs macOS), but both are shipped, and
      # cargo-deny only needs to resolve them.
      - name: cargo deny check
        run: cargo deny --all-features check

  # --------------------------------------------------------------------------------------
  # Python utility scripts. scripts/ and validation/ are developer tooling, not a package, so
  # the rule set in .ruff.toml is deliberately narrow. `ruff format` is NOT enforced: 14 of 20
  # files would be reformatted today, and that is a separate decision from linting.
  # --------------------------------------------------------------------------------------
  python-lint:
    name: ruff (scripts/ + validation/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install --disable-pip-version-check 'ruff==0.16.1'

      - name: ruff check
        run: ruff check --no-cache scripts/ validation/
