name: Set up the diar-native build environment
description: >-
  Installs the system libraries speakrs links against, pins the Rust toolchain, populates the
  gitignored vendor/speakrs path dependency, and restores the cargo caches. This is the single
  definition of the CI build environment — CONTRIBUTING.md documents how to reproduce it locally.

inputs:
  cache-key:
    description: >-
      Discriminator for the cargo cache. Give each job its own value; clippy and rustc write
      incompatible artifacts into target/ and will thrash a shared cache.
    required: true

runs:
  using: composite
  steps:
    # speakrs is built with its `openblas-system` feature, so OpenBLAS has to come from the
    # system — this is exactly why the project cannot be built on a stock developer machine.
    # libclang is for bindgen (ort-sys); cmake and build-essential are for the C/C++ deps.
    - name: Install system build dependencies
      shell: bash
      run: |
        sudo apt-get update
        # Single source of truth, shared with docker/Dockerfile.builder and
        # scripts/setup_dev_env.sh. Do not inline the list here.
        grep -vE '^\s*(#|$)' scripts/build-deps.txt \
          | xargs sudo apt-get install -y --no-install-recommends

    - name: Pin the Rust toolchain
      shell: bash
      run: |
        # No explicit channel: rustup reads rust-toolchain.toml, so CI, the dev container and
        # a workstation all resolve to the SAME compiler. Pinning `stable` here instead would
        # let CI drift onto a new release (and its new lints) while the frozen dev container
        # stayed behind — red CI on code that passed locally an hour earlier.
        rustup show active-toolchain
        cargo --version
        rustc --version
        cargo clippy --version

    # vendor/ is gitignored and is NOT a submodule, but speakrs is a path dependency — a clean
    # clone cannot resolve the workspace until this runs. The script clones the public
    # attevon-llc/speakrs fork at a pinned commit; it needs no credentials and never prompts.
    #
    # It does NOT fetch vendor/speakrs/fixtures/models/ (gitignored upstream, and gated
    # anyway). Nothing CI runs needs them.
    - name: Populate vendor/speakrs
      shell: bash
      run: ./scripts/bootstrap_vendor_speakrs.sh

    # Placed after the bootstrap so the pinned speakrs Cargo.lock participates in the key:
    # moving the vendor pin then correctly invalidates the cache.
    - name: Restore cargo and target caches
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ runner.os }}-cargo-${{ inputs.cache-key }}-${{ hashFiles('Cargo.lock', 'vendor/speakrs/Cargo.lock', 'scripts/bootstrap_vendor_speakrs.sh') }}
        restore-keys: |
          ${{ runner.os }}-cargo-${{ inputs.cache-key }}-
